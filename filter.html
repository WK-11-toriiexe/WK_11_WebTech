<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podstawy filter()</title>
</head>
<body>
    <script>
        const numbers = [3, 8, 12, 5, 20]; 

        const greaterThanTen = numbers.filter((number) => number > 10);
        const mniejszeNizDziesiec = numbers.filter((number) => number < 10);
        const rowneDwadziescia = numbers.filter((number) => number === 20);


        console.log(greaterThanTen); // [12, 20]
        console.log(mniejszeNizDziesiec); // [3, 8, 5]
        console.log(rowneDwadziescia); // [20]

        console.log(numbers); // [3, 8, 12, 5, 20]
        //Napisane przez: Kędzior Wiktoria 4P
    </script>
</body>
</html>
